name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: tests
        continue-on-error: true
        run: npx playwright test --project=desktop-chrome
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          UI_LANGUAGE: ${{ secrets.UI_LANGUAGE }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload report to S3
        id: upload
        if: ${{ !cancelled() }}
        run: npx tsx scripts/upload-report.ts --status=${{ steps.tests.outcome }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CLOUDFRONT_DOMAIN: ${{ secrets.CLOUDFRONT_DOMAIN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-desktop-chrome
          path: playwright-report/
          retention-days: 7

      - name: Comment report URL on PR
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const reportUrl = '${{ steps.upload.outputs.report-url }}';
            if (!reportUrl) return;
            const status = '${{ steps.tests.outcome }}';
            const icon = status === 'success' ? ':white_check_mark:' : ':x:';
            const body = [
              `## ${icon} E2E Test Report`,
              '',
              `**Status:** ${status}`,
              `**Report:** [View full report](${reportUrl})`,
              '',
              `<sub>Generated by CI run #${{ github.run_number }}</sub>`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('E2E Test Report'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
